name: spacia
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ─── Per Spacia README: Python>=3.8, R>=4.0.5 (minimums) ────────────────────
  # Citation: Zhu J et al. Nat Methods 21, 1830-1842 (2024)
  - python=3.8
  - r-base>=4.2

  # ─── Python deps (paper-pinned versions) ────────────────────────────────────
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - numpy=1.24.3
  - scipy=1.10.1
  - matplotlib=3.7.2

  # ─── R deps for Bayesian MIL inference ──────────────────────────────────────
  - r-coda
  - r-ggmcmc
  - r-rcpp
  - r-rcpparmadillo
  - r-rjson
  - r-data.table

  # ─── Common (anndata bridge) ────────────────────────────────────────────────
  - h5py
  - pip
  - pip:
    - anndata>=0.9
