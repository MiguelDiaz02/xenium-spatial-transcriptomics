name: xenium_pipeline
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip>=23.0
  - snakemake>=8.0
  - pytorch>=2.1
  - pytorch-cuda=12.1       # RTX 4500 Ada (sm_89), driver >=525
  - torchvision
  - numpy<2.0               # scvi-tools compat
  - hdf5>=1.14
  - faiss-gpu>=1.7.4        # fast neighbor search (conda-forge, not pip)
  - pip:
    - spatialdata>=0.2.2
    - spatialdata-io>=0.1.6
    - scanpy>=1.10.0
    - anndata>=0.10.0
    - squidpy>=1.4.0
    - liana>=1.7.1            # standard CCC framework (multi-platform spatial)
    - scvi-tools>=1.1.0       # includes RESOLVI
    - celltypist>=1.6.3
    - cellpose>=3.0.0
    - harmonypy>=0.0.9
    - scrublet>=0.2.3
    - pydeseq2>=0.4.0
    - leidenalg>=0.10.0
    - python-igraph>=0.11.0
    - matplotlib>=3.8.0
    - seaborn>=0.13.0
    - plotly>=5.18.0
    - rich>=13.7.0
    - tqdm>=4.66.0
    - jupyterlab>=4.0.0
    - ipykernel
    - pyarrow>=14.0.0         # parquet support
    # Baysor is Julia-based; install separately:
    # curl -sSL https://install.julialang.org | sh
    # julia -e 'using Pkg; Pkg.add("Baysor")'
    # Then: pip install baysorpy (Python wrapper)
