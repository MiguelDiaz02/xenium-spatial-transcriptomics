# ─── Project ──────────────────────────────────────────────────────────────────
project:
  name: human_lung_cancer
  output_dir: ../human_lung_cancer/results

# ─── Data paths (relative to pipeline/) ──────────────────────────────────────
data:
  xenium_zip: ../human_lung_cancer/output_files/Xenium_V1_Human_Lung_Cancer_FFPE_outs.zip
  xenium_extracted_dir: ../human_lung_cancer/output_files/extracted
  he_image: ../human_lung_cancer/supplemental_files/Xenium_V1_Human_Lung_Cancer_FFPE_he_image.ome.tif
  he_alignment: ../human_lung_cancer/supplemental_files/Xenium_V1_Human_Lung_Cancer_FFPE_he_imagealignment.csv

# ─── Module switches ──────────────────────────────────────────────────────────
run:
  denoising_resolvi: false    # false → skip ResolVI (requires rapids_singlecell), use normalized counts
  integration: false           # true → run Harmony/scVI (multi-sample only)
  spatial_analysis: true       # true → enable Squidpy spatial analysis (now optimized)
  downstream: true             # pseudobulk + doublet detection
  muspan: false                # requires separate MuSpAn install

# ─── Segmentation ─────────────────────────────────────────────────────────────
segmentation:
  method: xoa                  # "auto" | "xoa" | "cellpose" | "baysor" - Using xoa (10x native) due to Cellpose incompatibility with DAPI
  run_comparison: false        # Disable comparison report (not applicable for xoa)
  auto_thresholds:
    min_transcripts_for_baysor: 100   # median tx/cell required for Baysor
    min_genes_for_baysor: 500         # panel size required for Baysor
  cellpose:
    model: nuclei              # Changed from 'cyto' to 'nuclei' for DAPI-specific segmentation
    diameter: null             # null → auto-estimate
    flow_threshold: 0.4
    cellprob_threshold: -3.0   # More permissive (-3.0 vs 0.0) to detect more cells
    use_he: false              # use DAPI morphology_focus (more reliable for Cellpose)
    gpu: true
    tile_size: 1024            # tile size in pixels for tiling (1024×1024)
    tile_overlap: 128          # overlap between tiles to avoid edge artifacts
    stitch_threshold: 0.1      # threshold for Cellpose native stitching (0.0-1.0)
  baysor:
    # REQUIRES Julia + Baysor installed (see envs/xenium_pipeline.yaml)
    min_molecules_per_cell: 10
    scale: 30                  # expected cell radius in µm
    prior_segmentation_confidence: 0.5   # 0=ignore XOA masks, 1=trust fully
    n_clusters: 4              # expression clusters for initialization

# ─── QC ───────────────────────────────────────────────────────────────────────
qc:
  min_transcripts: 10
  max_transcripts: 2000        # removes doublets / segmentation errors
  min_genes: 5
  max_pct_neg_ctrl: 5.0        # % of negative control transcripts per cell
  max_cell_area_um2: 1500      # tissue-morphology dependent; reset histogram per dataset

# ─── Preprocessing ────────────────────────────────────────────────────────────
preprocess:
  normalization_target_sum: 100     # scran-style for targeted panels
  log1p: true
  select_hvg: false                 # false for panels <500 genes (use all)
  n_hvg: 289                        # only used if select_hvg: true

# ─── Dimensionality reduction ─────────────────────────────────────────────────
reduction:
  n_pcs: 30
  n_neighbors: 15
  umap_min_dist: 0.3
  leiden_resolution: 0.5

# ─── Annotation ───────────────────────────────────────────────────────────────
annotation:
  method: manual                # "celltypist" | "manual" | "scanvi"
  celltypist_model: ignore      # Not used with manual method
  majority_voting: false        # Not used with manual method
  # manual marker scoring (used if method: manual or for validation)
  markers:
    Epithelial: [EPCAM, KRT8, KRT18, KRT19]
    T_cell: [CD3D, CD3E, CD8A, CD4]
    B_cell: [CD79A, MS4A1, CD19]
    Macrophage: [CD68, CD163, MRC1]
    NK_cell: [GNLY, NKG7, KLRD1]
    Fibroblast: [COL1A1, COL1A2, DCN, FAP]
    Endothelial: [PECAM1, VWF, CDH5]
    Mast_cell: [TPSAB1, CPA3]
    Tumor: [TP63, MKI67, TOP2A]

# ─── Immune Cell Subclustering (Step 06b) ─────────────────────────────────────
# Markers sourced from: Propuesta panel Pulmón 2025 (custom immunology panel, INP (Instituto Nacional de Pediatría))
immune_annotation:
  enabled: true                                # Enable immune subclustering step
  immune_cell_types:                           # Cell types to subset for immune analysis
    - "T_cell"
    - "B_cell"
    - "Macrophage"
    - "NK_cell"
    - "Mast_cell"
  leiden_resolution_immune: 1.2                # High resolution for immune heterogeneity
  n_pcs_immune: 25                             # PCA components (immune subset)
  min_immune_cluster_size: 50                  # Minimum cells per cluster
  validation_threshold: 0.7                    # Min purity for PASS status (0-1)
  # Granular immune cell type marker panels (extracted from Xenium immunology panel)
  immune_markers:
    CD8_T_cell: [GNLY, GZMK, GZMA, GZMB, PRF1, CD8A, CD8B, EOMES, CST7, CXCR6]
    CD4_T_cell: [TCF7, CCR7, CD4, IL7R, GATA3, NOTCH1]
    Treg: [CTLA4, IL2RA, FOXP3, CXCL13, IRF4, STAT3]
    NK_cell: [GNLY, NKG7, CST7, STAT4, CXCL16, KLRB1, KLRD1, KLRK1]
    M1_Macrophage: [CD44, VCAN, STAT1, TNF, IL6, CXCL1, CXCL5, CCR2, CCR1]
    M2_Macrophage: [CD163, EGF, FGF2, MRC1, ARG1, IL10]
    B_cell: [MS4A1, CD19, CD27, SELL, STMN1, MKI67, IGHM]
    Plasma_cell: [IGHG1, IGHG2, IGHG3, JCHAIN, IGKC, SSR4, DERL3, XBP1]
    Monocyte: [CD14, CSF1R, CSF1, FCGR3A, C1QB, LILRA5, MIS18BP1, CCR2]
    Dendritic_cell: [CD1A, CD1C, IRF8, CXCL14, IL23A, PLA2G7, FCER1A, CLEC10A]

# ─── ResolVI denoising ────────────────────────────────────────────────────────
denoising:
  max_epochs: 100
  batch_size: 1024
  accelerator: gpu              # "gpu" | "cpu"

# ─── Integration (multi-sample) ───────────────────────────────────────────────
integration:
  method: harmony               # "harmony" | "scvi"
  batch_key: sample             # column in adata.obs

# ─── Spatial analysis ─────────────────────────────────────────────────────────
spatial:
  n_neighs: 10
  coord_type: generic           # "generic" (centroids) | "grid"
  cluster_key: cell_type        # column used for enrichment / co-occurrence
  n_perms_enrichment: 250       # Reduced: 268k cells @ 15 clusters (1000 too intensive)
  spatial_autocorr:
    mode: moran
    n_perms: 100
    n_jobs: 4

# ─── Downstream ───────────────────────────────────────────────────────────────
downstream:
  doublet_detection: true
  pseudobulk: false             # requires ≥3 samples; set true for multi-sample
  pseudobulk_group_key: cell_type
  pseudobulk_sample_key: sample

# ─── Extended Analysis (Visualization, Analysis, Export) ─────────────────────
extended_steps:
  visualization: true           # Generate publication-quality figures
  extended_analysis: true       # Compute cell-type specific spatial patterns
  export: true                  # Package results in multiple formats

# ─── Multi-tool Analysis Pipeline (Snakefile_analysis) ────────────────────────
# Spec: docs/superpowers/specs/2026-04-27-multi-tool-pipeline-spec.md
# Markers DB: pipeline/config/cell_markers_lung.yaml
analysis:

  # F0 — Hierarchical re-annotation (L1/L2/L3)
  f0_reannotation:
    enabled: true
    z_score_threshold: 1.0
    ambiguity_threshold: 0.3

  # F1 — Spatial domains (Novae + Banksy consensus)
  f1_domains:
    novae:
      enabled: true
      pretrained: "MICS-Lab/novae-human-0"
      n_levels: [5, 10, 20]                # multi-resolution hierarchical
      radius_um: 200
      batch_correct: true
    banksy:
      enabled: true
      lambda: 0.2                          # 0.0=non-spatial, 1.0=fully spatial
      k_geom: 6                            # k-nearest geometric neighbors
      n_clusters: 10

  # F2 — Spatial Variable Genes (multi-tool consensus)
  f2_svg:
    enabled: true
    methods: [moran, hotspot, nnsvg]       # Wilcoxon+Moran's existing; add Hotspot + nnSVG
    min_methods_for_robust: 2              # robust SVG = sig in ≥2 methods
    hotspot:
      n_neighbors: 30
      model: danb                          # negative binomial
      fdr_threshold: 0.05
    nnsvg:
      n_neighbors: 10                      # Gaussian process kernel

  # F3 — CCC validation (LIANA+ rank_aggregate + Spacia)
  f3_ccc:
    liana:
      enabled: true
      method: rank_aggregate               # consensus over CellPhoneDB, NATMI, Connectome, SCSignalR, logFC
      n_perms: 1000
      min_cells: 50                        # min cells per cluster
      expr_prop: 0.1                       # min expression proportion of L-R per cluster
      fdr_method: bh                       # BH-FDR over cellphone_pvals (the audit-correct setting)
      fdr_threshold: 0.05
    liana_bivariate:                       # legacy params kept for back-compat
      enabled: false
      local_name: cosine
      n_perms: 1000
      n_neighbors: 15
      radius_um: 200
      nz_prop: 0.05
    spacia_validation:
      enabled: true
      top_n_pairs: 30                      # validate top-30 LIANA+ hits
      mcmc_params: "50000,20000,100,2"     # Ntotal,Nwarm,Nthin,Nchains (publishable)
      n_cells_subsample: 5000              # subsample per cell type (-nc)
      dist_cutoff_um: 30                   # juxtacrine range (-d)
      multiple_testing: bonferroni         # cross-test correction (audit-corrected)
      # spacia_repo: resolved via SPACIA_PATH env var or pipeline/external/Spacia/
      # (Docker image: spacia:audited, 4.4 GB). Do not hardcode here.

  # F4 — Niche-DE (context-dependent expression)
  f4_niche_de:
    enabled: true
    domains_source: novae                  # use Novae domains as niches
    celltype_col: cell_type_L2
    fdr_threshold: 0.05
    log2fc_threshold: 0.5

  # F5 — Spatial pseudotime (Slingshot + tradeSeq GAM)
  f5_pseudotime:
    enabled: true
    trajectory_anchor: tumor_distance      # rank by distance to tumor centroid
    tumor_celltypes: [Tumor_proliferating, Tumor_resting]
    slingshot:
      embedding_source: novae              # use Novae embeddings as latent space
      start_cluster: stroma_far
    tradeseq:
      n_knots: 6
      pval_threshold: 0.05

  # F5b — Tertiary Lymphoid Structure detection
  f5b_tls:
    enabled: true
    eps_um: 50                             # DBSCAN cluster radius
    min_samples: 30                        # min cells to form a TLS
    tls_score_threshold: 1.5               # z-score threshold from F0 L3 scoring

  # F6 — Annotation cross-validation (optional)
  f6_annotation_xval:
    enabled: false                         # opt-in (slow, runs in R)
    method: singler
    reference: Sikkema2023_HCA_Lung        # alt: Travaglini2020_HCA_Lung

  # F8 — Novae foundation model embeddings
  f8_novae:
    enabled: true
    output_embeddings: true
    pathway_analysis: true
    pathway_db: msigdb_hallmark
