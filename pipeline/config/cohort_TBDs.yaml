# ─── Integration / DGE / CCC / spatial parameters ─────────────────────────
integration:
  batch_key: sample_id              # core, with subject_id as a covariate downstream
  n_latent: 30
  n_layers: 2
  gene_likelihood: nb
  max_epochs: 400
  early_stopping: true
  use_gpu: true
  hvg_top_n: null

pseudobulk:
  groupby:
    - cell_type_L2
    - subject_id                    # DONOR-level, NOT core (controls pseudo-replication)
  reference_condition: control
  # Contrasts are organ-aware; pulled from organs.<organ>.contrasts at runtime.
  min_cells_per_pseudobulk: 10
  min_donors_per_group: 2
  fdr_threshold: 0.05
  lfc_threshold: 0.585

ccc_multisample:
  sample_key: subject_id            # aggregate within donor before cross-donor view
  condition_key: condition
  method: rank_aggregate
  resource: consensus
  n_perms: 1000
  min_cells: 50
  expr_prop: 0.1
  fdr_method: bh
  fdr_threshold: 0.05

spacia_meta:
  per_sample: true                  # one Spacia run per core
  meta_unit: subject_id             # aggregate cores → donor → cohort
  mcmc_params: "50000,20000,100,2"
  n_cells_subsample: 5000
  dist_cutoff_um: 30
  multiple_testing: bonferroni
  meta_method: stouffer
  min_donors_validating: 2

pseudotime_cohort:
  target_lineages:
    lung:
      - {name: "AT2_to_AT1",            anchor_celltypes: [AT2, AT2_dysfunctional, AT1]}
      - {name: "Fibroblast_activation", anchor_celltypes: [Fibroblast_general, Myofibroblast]}
    liver:
      - {name: "HSC_activation",        anchor_celltypes: [HSC_quiescent, HSC_activated]}
      - {name: "Hepatocyte_zonation",   anchor_celltypes: [Hepatocyte_periportal, Hepatocyte_pericentral]}
  method: slingshot
  condition_test: tradeSeq

spatial_domains:
  cross_sample_mode: novae
  novae_finetune_epochs: 100
  per_core: true                    # domains computed per core, harmonized across cohort
