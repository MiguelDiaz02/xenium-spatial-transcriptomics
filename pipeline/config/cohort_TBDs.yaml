# Cohort definition — TBDs (Telomere Biology Disorders) lung + liver fibrosis
# =========================================================================
# DESIGN (locked 2026-05-11, panel design PDF reviewed):
#   - 2 Xenium TMA slides (one per organ): LUNG_AF and LIVER_AF
#   - Each TMA = ~55–60 cores from multiple donors with technical replicates
#   - Donor breakdown:
#       LUNG_AF  : 10 TBD + 3 NS + 3 NN  = 16 donors  → ~55 cores
#       LIVER_AF : 4 TBD  + 4 Control + 4 Alc_Cirh = 12 donors → ~60 cores
#   - All TBD donors are clinically fibrotic at biopsy.
#   - Sample granularity = CORE (sample_id ≡ TMA_DONOR_coreNN).
#   - Statistical unit = DONOR (subject_id). Pseudobulk aggregates over cores
#     of the same (cell_type, subject_id).
#   - Cohort-level controls:
#       Lung   → NS (non-short-telomere) + NN (non-neoplastic) = healthy reference
#       Liver  → Control (healthy) + Alc_Cirh (fibrotic non-TBD reference)
#
# IMPORTANT — this template lists the donor x core matrix expected from the
# panel-design PDF. Once the per-core polygons are resolved (Xenium Explorer
# or sopa.utils.dearray), the operator must:
#   1. populate ``core_id`` exactly as it appears in the per-TMA sdata.zarr
#      ``obs.core_id`` column.
#   2. assign actual TBD subject IDs (TBD1–TBD10 may map to real donor IDs
#      like SUBJ_TBD_001..010 once de-anonymized).
#   3. add ``replicates_expected`` per donor to flag missing cores at QC time.

cohort_id: TBDs_v1
description: "TBDs lung + liver TMA cohort — 2 Xenium slides, ~28 donors total"
created: 2026-05-11

# ─── condition axis (unified across organs) ───────────────────────────────
# Reference category for DE = first entry. Per-organ contrasts below.
conditions:
  - control                # NS + NN (lung) or Control (liver)
  - fibrotic_nonTBD        # Alc_Cirh (liver only)  → liver-specific contrast
  - fibrotic_TBD           # TBD donors (both organs) → primary disease group

# Auxiliary categorical axes (always present in obs):
#   tbd_status         : {TBD, nonTBD}
#   control_subtype    : {NS, NN, Control, AlcCirh, None}  — fine-grained
#   tma_slide          : {LUNG_AF, LIVER_AF}
#   organ              : {lung, liver}

organs:
  lung:
    panel_name: "Xenium TBDs lung panel (439 genes)"
    n_genes_total: 439
    tma_slide: LUNG_AF
    markers_yaml: pipeline/config/markers/lung_TBDs.yaml
    analysis_config: pipeline/config/config_lung.yaml
    # TMA-level outputs (one sdata.zarr for the whole TMA):
    tma_raw_dir: TBDs/lung/raw
    tma_sdata: TBDs/lung/results/sdata_TMA.zarr
    contrasts:
      - {test: fibrotic_TBD, ref: control}             # primary disease test
  liver:
    panel_name: "Xenium TBDs liver panel (439 genes)"
    n_genes_total: 439
    tma_slide: LIVER_AF
    markers_yaml: pipeline/config/markers/liver_TBDs.yaml
    analysis_config: pipeline/config/config_liver.yaml
    tma_raw_dir: TBDs/liver/raw
    tma_sdata: TBDs/liver/results/sdata_TMA.zarr
    contrasts:
      - {test: fibrotic_TBD,   ref: control}            # TBD vs healthy
      - {test: fibrotic_nonTBD, ref: control}           # Alc cirrhosis vs healthy
      - {test: fibrotic_TBD,   ref: fibrotic_nonTBD}    # KEY: TBD-specific vs generic fibrosis

# ─── donor manifest (no per-core enumeration; cores resolved at runtime) ──
# At runtime, ``utils.cohort.load_cohort()`` expands each donor into one
# ``SampleSpec`` per core by reading the per-TMA sdata's obs.core_id column.
# Field ``cores_expected`` is a soft check (warn if discrepancy).
